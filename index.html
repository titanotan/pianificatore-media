<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pianifica la tua carriera universitaria: scopri quali voti ti servono per raggiungere la media obiettivo."
    />
    <title>Piano Carriera</title>
    <script>
      // Applica il tema prima del primo disegno della pagina, per evitare il "lampo" chiaro→scuro.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem('piano-carriera:theme')
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
